name: Keep FalkorDB Cloud awake

# The free FalkorDB Cloud tier stops an instance after a day without use.
# Twice a day, run one read query against it. Needs repository secrets:
# FALKORDB_HOST, FALKORDB_PORT, FALKORDB_USERNAME, FALKORDB_PASSWORD.
on:
  schedule:
    - cron: "17 */12 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install falkordb==1.8.0 python-dotenv==1.2.4
      - run: python -m scripts.keepalive
        env:
          FALKORDB_HOST: ${{ secrets.FALKORDB_HOST }}
          FALKORDB_PORT: ${{ secrets.FALKORDB_PORT }}
          FALKORDB_USERNAME: ${{ secrets.FALKORDB_USERNAME }}
          FALKORDB_PASSWORD: ${{ secrets.FALKORDB_PASSWORD }}
          FALKORDB_GRAPH: antidote

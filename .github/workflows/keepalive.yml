name: Keep the demo awake

# During judging. Render's free web service sleeps after 15 idle minutes, and the free
# FalkorDB Cloud tier stops after a day without use. Every 12 minutes, ask the app for
# its health: the app pings FalkorDB to answer, so both stay up, and the job fails (and
# GitHub emails you) if FalkorDB is unreachable.
#
# Needs one repository variable, no secrets: APP_URL, e.g. https://antidote-xxxx.onrender.com
# (Settings > Secrets and variables > Actions > Variables).
on:
  schedule:
    - cron: "*/12 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ask the app for its health
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          if [ -z "$APP_URL" ]; then echo "Set the APP_URL repository variable first."; exit 1; fi
          curl -sS --fail-with-body --max-time 90 --retry 3 --retry-delay 20 "$APP_URL/api/health"

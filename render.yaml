# Render Blueprint: one free web service, built from the Dockerfile.
# Secrets are `sync: false`: Render asks for their values in the dashboard,
# so they never live in this repository.
services:
  - type: web
    name: antidote
    runtime: docker
    region: singapore          # closest Render region to FalkorDB Cloud ap-south-1
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /         # the static page; /api/health is 503 when FalkorDB is down
    envVars:
      - key: FALKORDB_GRAPH
        value: antidote
      - key: ANTIDOTE_LIVE_AI  # replay works with no key; live AI stays off in production
        value: "off"
      - key: FALKORDB_HOST
        sync: false
      - key: FALKORDB_PORT
        sync: false
      - key: FALKORDB_USERNAME
        sync: false
      - key: FALKORDB_PASSWORD
        sync: false
